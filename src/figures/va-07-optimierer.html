<!-- title: Momentum, SGD und Adam
     lib: va -->
<figure class="fig">
  <canvas id="cv-op" class="c-va-sq" role="img" aria-label="Pfade von Gradientenabstieg, Momentum und Adam auf derselben Landschaft."></canvas>
  <div class="ctrls">
    <div class="ctrl" style="flex:0 1 200px"><div class="lab"><label for="op-f">Landschaft</label></div><select id="op-f" autocomplete="off" style="width:100%"><option value="schlecht" selected>schlecht konditioniert</option><option value="rosen">Rosenbrock-Tal</option><option value="mulden">zwei Mulden</option></select></div>
    <div class="ctrl"><div class="lab"><label for="op-e">Lernrate η</label><output id="op-e-o"></output></div><input id="op-e" type="range" min="-2.5" max="-0.5" step="0.01" value="-1.52" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="op-n">Schritte</label><output id="op-n-o"></output></div><input id="op-n" type="range" min="0" max="150" step="1" value="60" autocomplete="off"></div>
  </div>
  <div class="ctrls">
    <label class="chk"><input id="op-s" type="checkbox" autocomplete="off"> verrauschte Gradienten (SGD)</label>
    <button class="btn" type="button" id="op-p">Abspielen</button>
  </div>
  <div class="readout" id="op-read"></div>
  <figcaption><b>Abb.</b> Drei Verfahren mit derselben Lernrate vom selben Startpunkt (ziehbar). Gradientenabstieg (rot) läuft im Zickzack. Momentum (gelb) mittelt die Schritte über die Zeit: Das Hin und Her quer zum Tal hebt sich auf, die Bewegung entlang des Tals summiert sich und wird schneller, schießt aber auch über. Adam (blau) teilt jede Koordinate durch ihre typische Gradientengröße, macht damit in steilen und flachen Richtungen ähnlich große Schritte und kommt mit schlechter Kondition gut zurecht. Mit verrauschten Gradienten, wie beim Training mit kleinen Datenpaketen (SGD), zittern alle Pfade, erreichen aber trotzdem die Nähe des Minimums.</figcaption>
</figure>
<script>
/* ---------- Optimierer ---------- */
(() => {
  const c = $('#cv-op'), iff = $('#op-f'), ie = $('#op-e'), inn = $('#op-n'), is = $('#op-s'), bp = $('#op-p'); let P = null;
  const st = { schlecht: [-2.6, 1.2], rosen: [-1.4, 1.6], mulden: [2.2, -1.8] }, VIEW = { schlecht: [3, 0, 0], rosen: [2.1, 0, 0.7], mulden: [3, 0, 0] };
  const run = (f, p0, eta, N, kind, noise) => { setSeed(4711); let p = p0.slice(), v = [0, 0], s = [0, 0]; const path = [p.slice()];
    for (let k = 1; k <= N; k++) { let g = grad2(f, ...p); if (noise) g = [g[0] + 0.6 * gauss(), g[1] + 0.6 * gauss()];
      if (kind === 'gd') p = [p[0] - eta * g[0], p[1] - eta * g[1]];
      else if (kind === 'mom') { v = [0.9 * v[0] + g[0], 0.9 * v[1] + g[1]]; p = [p[0] - eta * v[0], p[1] - eta * v[1]]; }
      else { v = [0.9 * v[0] + 0.1 * g[0], 0.9 * v[1] + 0.1 * g[1]]; s = [0.999 * s[0] + 0.001 * g[0] ** 2, 0.999 * s[1] + 0.001 * g[1] ** 2];
        const mh = v.map(x => x / (1 - 0.9 ** k)), sh = s.map(x => x / (1 - 0.999 ** k)); p = [p[0] - 3 * eta * mh[0] / (Math.sqrt(sh[0]) + 1e-8), p[1] - 3 * eta * mh[1] / (Math.sqrt(sh[1]) + 1e-8)]; }
      if (!isFinite(p[0]) || Math.hypot(...p) > 50) break; path.push(p.slice()); } return path; };
  const m = reg({ el: c, playing: false, anim: true, t: 0, step(dt) { this.t += dt * 30; if (this.t >= 150) { this.t = 150; this.playing = false; bp.textContent = 'Abspielen'; } inn.value = Math.floor(this.t); }, draw() {
    const key = iff.value, L = LANDS[key], f = L.f, eta = 10 ** +ie.value, N = +inn.value; $('#op-e-o').textContent = nf(eta, 3); $('#op-n-o').textContent = N;
    const { ctx, w, h } = fit(c); P = view(ctx, 0, 0, w, h, ...VIEW[key]);
    const G = sample(P, f, 4); shade(P, G, L.lo, L.hi, tok('--accent'), 0.25);
    contours(P, G, key === 'rosen' ? [0.005, 0.02, 0.05, 0.1, 0.2, 0.4, 0.7, 1.1, 1.6, 2.4, 3.5, 5] : linLevels(L.lo, L.hi, 14), rgba(tok('--fg'), 0.35), 1);
    const M = [['gd', 'Gradientenabstieg', tok('--hole')], ['mom', 'Momentum (β = 0,9)', tok('--bin2')], ['adam', 'Adam', tok('--accent')]], res = [];
    P.clip(); M.forEach(([k, , col]) => { const path = run(f, st[key], eta, N, k, is.checked); res.push(path); poly(P, path); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke(); dot(P, ...path.at(-1), col, 4.5); }); P.unclip();
    handle(P, ...st[key], tok('--fg'));
    legend(ctx, 10, 18, M.map(([, n, col]) => [n, col]), { maxW: w - 20 });
    $('#op-read').innerHTML = `<span class="k">f nach ${N} Schritten:</span> ` + M.map(([, n], i) => `${n} <b>${res[i].length - 1 < N ? 'divergiert' : ex(f(...res[i].at(-1)), 2)}</b>`).join('  <span class="k">·</span>  ');
  } });
  draggable(c, [{ get: () => st[iff.value], set: (x, y) => { st[iff.value] = [x, y]; } }], () => P, () => m.draw());
  [iff, ie, inn, is].forEach(e => e.addEventListener('input', rafDebounce(() => { m.t = +inn.value; m.draw(); })));
  bp.addEventListener('click', () => { m.playing = !m.playing; if (m.playing && m.t >= 150) m.t = 0; if (m.playing) m.t = 0; bp.textContent = m.playing ? 'Anhalten' : 'Abspielen'; });
})();
</script>
