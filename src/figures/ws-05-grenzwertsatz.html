<!-- title: Zentraler Grenzwertsatz
     lib: ws -->
<figure class="fig">
  <canvas id="cv-zg" class="c-ws" role="img" aria-label="Links die Ausgangsverteilung, rechts das Histogramm standardisierter Mittelwerte aus n Ziehungen mit der Standardnormalverteilung darüber."></canvas>
  <div class="ctrls">
    <div class="ctrl" style="flex:0 1 190px"><div class="lab"><label for="zg-d">Ausgangsverteilung</label></div><select id="zg-d" autocomplete="off"><option value="e">exponentiell</option><option value="u">gleichverteilt</option><option value="b">U-förmig</option><option value="c">Münzwurf (0 oder 1)</option></select></div>
    <div class="ctrl"><div class="lab"><label for="zg-n">Werte pro Mittelwert n</label><output id="zg-n-o"></output></div><input id="zg-n" type="range" min="1" max="50" step="1" value="1" autocomplete="off"></div>
    <button class="btn" type="button" id="zg-p">Abspielen</button>
  </div>
  <div class="readout" id="zg-read"></div>
  <figcaption><b>Abb.</b> Aus der Ausgangsverteilung (links) werden immer wieder \(n\) Werte gezogen und gemittelt, 20 000 Mal. Rechts das Histogramm dieser Mittelwerte, standardisiert auf Mittelwert 0 und Streuung 1, mit der Standardnormalverteilung als Linie. Bei \(n = 1\) sieht man die Ausgangsverteilung selbst. Schon ab wenigen Werten wird das Histogramm gaußförmig, bei schiefen Verteilungen dauert es etwas länger. Beim Münzwurf sind die Mittelwerte diskret, und erst mit größerem \(n\) liegen die Stufen dicht genug.</figcaption>
</figure>
<script>
/* ---------- Zentraler Grenzwertsatz ---------- */
(() => {
  const c = $('#cv-zg'), id = $('#zg-d'), inn = $('#zg-n'), bp = $('#zg-p'), M = 20000; let key = '', Z = null;
  const D = {
    e: { lo: -0.2, hi: 5, pdf: x => x < 0 ? 0 : Math.exp(-x), s: () => rExp(1), mu: 1, sd: 1, sk: 2 },
    u: { lo: -0.2, hi: 1.2, pdf: x => x >= 0 && x <= 1 ? 1 : 0, s: () => rnd(), mu: 0.5, sd: Math.sqrt(1 / 12), sk: 0 },
    b: { lo: 0, hi: 1, pdf: x => x > 0.003 && x < 0.997 ? 1 / (Math.PI * Math.sqrt(x * (1 - x))) : NaN, s: () => Math.sin(Math.PI * rnd() / 2) ** 2, mu: 0.5, sd: Math.sqrt(1 / 8), sk: 0 },
    c: { lo: -0.3, hi: 1.3, pdf: null, s: () => rnd() < 0.5 ? 0 : 1, mu: 0.5, sd: 0.5, sk: 0 },
  };
  const m = reg({ el: c, playing: false, t: 1, anim: true, step(dt) { this.t += dt * 6; if (this.t > 50) { this.t = 50; this.playing = false; bp.textContent = 'Abspielen'; } inn.value = Math.round(this.t); },
    draw() {
    const d = D[id.value], n = +inn.value; $('#zg-n-o').textContent = n;
    if (key !== id.value + n) { key = id.value + n; setSeed(99 + n * 31 + id.value.charCodeAt(0)); Z = new Float64Array(M);
      for (let j = 0; j < M; j++) { let s = 0; for (let i = 0; i < n; i++) s += d.s(); Z[j] = (s / n - d.mu) / (d.sd / Math.sqrt(n)); } }
    const { ctx, w, h } = fit(c), narrow = w < 560;
    const r1 = narrow ? [0, 0, w, h * 0.36] : [0, 0, w * 0.3, h], r2 = narrow ? [0, h * 0.38, w, h * 0.62] : [w * 0.3 + 14, 0, w * 0.7 - 14, h];
    // links Ausgangsverteilung
    const f = frame(ctx, ...r1, { x0: d.lo, x1: d.hi, y0: 0, y1: id.value === 'b' ? 3 : id.value === 'c' ? 0.6 : 1.3, xt: [], yt: [], l: 10, t: 22, b: 14 });
    ctx.strokeStyle = tok('--fg'); ctx.lineWidth = 2; ctx.fillStyle = tok('--fg');
    if (d.pdf) { ctx.beginPath(); let on = false; for (let i = 0; i <= 300; i++) { const x = d.lo + (d.hi - d.lo) * i / 300, y = d.pdf(x); if (!isFinite(y)) { on = false; continue; } const Y = f.Y(Math.min(y, 3)); on ? ctx.lineTo(f.X(x), Y) : ctx.moveTo(f.X(x), Y); on = true; } ctx.stroke(); }
    else [0, 1].forEach(x => { ctx.fillRect(f.X(x) - 3, f.Y(0.5), 6, f.Y(0) - f.Y(0.5)); });
    ctx.font = `600 13px ${DISP}`; ctx.textAlign = 'left'; ctx.fillText('Ausgangsverteilung', r1[0], r1[1] + 14);
    // rechts Mittelwerte
    const nb = 64, { H, w: bw } = hist(Z, -4, 4, nb), dens = H.map(v => v / (M * bw));
    const ytop = Math.min(1.1, Math.max(0.6, 1.05 * Math.max(...dens))), g = frame(ctx, ...r2, { x0: -4, x1: 4, y0: 0, y1: ytop, xt: [-3, -2, -1, 0, 1, 2, 3], yt: [0, 0.2, 0.4], yf: v => nf(v, 1), xl: '(x̄ − μ) / (σ/√n)', l: 40, t: 22 });
    ctx.fillStyle = rgba(tok('--accent'), 0.35); dens.forEach((v, i) => { const x0 = g.X(-4 + i * bw), x1 = g.X(-4 + (i + 1) * bw), y = g.Y(Math.min(v, ytop)); ctx.fillRect(x0, y, x1 - x0 - 0.5, g.Y(0) - y); });
    ctx.strokeStyle = tok('--hole'); ctx.lineWidth = 2; curve(ctx, x => normPdf(x), g.X, g.Y, -4, 4);
    ctx.font = `600 13px ${DISP}`; ctx.fillStyle = tok('--fg'); ctx.textAlign = 'left'; ctx.fillText(`Mittelwerte aus je n = ${n} Werten`, r2[0], r2[1] + 14);
    let ks = 0; const so = Array.from(Z).sort((a, b) => a - b); for (let j = 0; j < M; j += 7) ks = Math.max(ks, Math.abs(normCdf(so[j]) - j / M));
    $('#zg-read').innerHTML = `<span class="k">Streuung des Mittelwerts:</span> σ/√n = ${nf(d.sd / Math.sqrt(n), 3)}  <span class="k">·</span>  <span class="k">Schiefe:</span> ${nf(d.sk / Math.sqrt(n), 2)} (Ausgang ${nf(d.sk, 0)}, fällt wie 1/√n)  <span class="k">·</span>  <span class="k">Abstand zur Normalverteilung:</span> <b>${nf(ks, 3)}</b>`;
  } });
  [id, inn].forEach(e => e.addEventListener('input', rafDebounce(() => { m.t = +inn.value; m.draw(); })));
  bp.addEventListener('click', () => { m.playing = !m.playing; if (m.playing && m.t >= 50) m.t = 1; bp.textContent = m.playing ? 'Anhalten' : 'Abspielen'; });
})();
</script>
