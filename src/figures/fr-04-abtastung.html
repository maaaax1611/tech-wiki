<!-- title: Abtastung und Aliasing
     lib: fr -->
<figure class="fig">
  <canvas id="cv-sa" class="c-fr-t" role="img" aria-label="Eine Kosinusschwingung, ihre Abtastwerte und die Schwingung niedrigster Frequenz durch dieselben Werte; darunter das Spektrum mit seinen periodischen Kopien."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="sa-f">Signalfrequenz f (in Einheiten der Abtastrate f<sub>s</sub>)</label><output id="sa-f-o"></output></div><input id="sa-f" type="range" min="0" max="2.2" step="0.005" value="0.12" autocomplete="off"></div>
  </div>
  <div class="readout" id="sa-read"></div>
  <figcaption><b>Abb.</b> Oben eine Schwingung (grau), abgetastet in festen Abständen (Punkte). Blau gestrichelt die Schwingung mit der niedrigsten Frequenz, die durch dieselben Punkte geht. Nur sie würde man aus den Abtastwerten rekonstruieren. Solange \(f < f_s/2\) ist, ist sie die richtige. Darüber erscheint eine falsche, niedrigere Frequenz (Alias). Unten der Grund im Spektrum: Abtasten wiederholt das Spektrum im Abstand \(f_s\). Liegt die Frequenz außerhalb des Nyquist-Bands (grau), rutscht eine ihrer Kopien hinein und ist von einer echten Frequenz nicht zu unterscheiden.</figcaption>
</figure>
<script>
/* ---------- Abtastung ---------- */
(() => {
  const c = $('#cv-sa'), iff = $('#sa-f'), ph = 0.5;
  const m = reg({ el: c, draw() {
    const fq = +iff.value, k = Math.round(fq), fa = fq - k; $('#sa-f-o').textContent = nf(fq, 3) + ' fₛ';
    const { ctx, w, h } = fit(c), A = tok('--accent'), Fg = tok('--fg'), Mu = tok('--muted'), H = tok('--hole');
    const T = 16, top = frame(ctx, 0, 0, w, h * 0.6, { x0: 0, x1: T, y0: -1.3, y1: 1.3, xt: [0, 4, 8, 12, 16], yt: [-1, 0, 1], xl: 'Zeit (in Abtastabständen)', l: 26, t: 20 });
    ctx.save(); ctx.beginPath(); ctx.rect(top.bx, top.by, top.bw, top.bh); ctx.clip();
    ctx.strokeStyle = rgba(Mu, 0.8); ctx.lineWidth = 1.6; curve(ctx, t => Math.cos(2 * Math.PI * fq * t + ph), top.X, top.Y, 0, T, 2000);
    ctx.strokeStyle = A; ctx.lineWidth = 2.2; ctx.setLineDash([6, 4]); curve(ctx, t => Math.cos(2 * Math.PI * fa * t + ph), top.X, top.Y, 0, T, 800); ctx.setLineDash([]);
    ctx.restore();
    for (let n = 0; n <= T; n++) { const v = Math.cos(2 * Math.PI * fq * n + ph); ctx.strokeStyle = rgba(Fg, 0.5); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(top.X(n), top.Y(0)); ctx.lineTo(top.X(n), top.Y(v)); ctx.stroke(); ctx.fillStyle = Fg; ctx.beginPath(); ctx.arc(top.X(n), top.Y(v), 4, 0, 2 * Math.PI); ctx.fill(); }
    title(ctx, 'Signal und Abtastwerte', 0, 13); legend(ctx, w, 13, [['Signal', Mu], ['aus den Abtastwerten rekonstruiert', A]], { right: true, maxW: w * 0.6 });
    const bot = frame(ctx, 0, h * 0.62, w, h * 0.38, { x0: -2.5, x1: 2.5, y0: 0, y1: 1.25, xt: w < 560 ? [-2, -1, 0, 1, 2] : [-2, -1, -0.5, 0, 0.5, 1, 2], xf: v => v === 0 ? '0' : nf(v, Math.abs(v) === 0.5 ? 1 : 0) + ' fₛ', yt: [], xl: 'Frequenz', l: 26, t: 20 });
    ctx.fillStyle = rgba(Mu, 0.15); ctx.fillRect(bot.X(-0.5), bot.by, bot.X(0.5) - bot.X(-0.5), bot.bh);
    const stem = (x, col, lw, hgt) => { if (x < -2.5 || x > 2.5) return; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(bot.X(x), bot.Y(0)); ctx.lineTo(bot.X(x), bot.Y(hgt)); ctx.stroke(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(bot.X(x), bot.Y(hgt), 3.5, 0, 2 * Math.PI); ctx.fill(); };
    for (let j = -4; j <= 4; j++) for (const s of [-1, 1]) { const x = s * fq + j; if (j === 0) continue; stem(x, rgba(Mu, 0.55), 1.4, 0.7); }
    stem(fq, Fg, 2.4, 1); stem(-fq, Fg, 2.4, 1); stem(fa, A, 3, 0.85); stem(-fa, A, 3, 0.85);
    title(ctx, 'Spektrum nach dem Abtasten', 0, h * 0.62 + 13);
    $('#sa-read').innerHTML = fq <= 0.5 ? `<span class="k">f = ${nf(fq, 3)} fₛ</span> liegt unter der Nyquist-Grenze fₛ/2: <b>wird richtig erfasst</b>, ${nf(1 / Math.max(fq, 1e-9), 1)} Abtastwerte pro Periode`
      : `<span class="k">f = ${nf(fq, 3)} fₛ</span> liegt über fₛ/2: <b>erscheint als ${nf(Math.abs(fa), 3)} fₛ</b>${Math.abs(fa) < 0.01 ? ', also fast als Konstante' : ''}`;
  } });
  iff.addEventListener('input', rafDebounce(() => m.draw()));
})();
</script>
