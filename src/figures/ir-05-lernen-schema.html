<figcaption><b>Abb.</b> Nachverarbeitung (oben) bekommt nur das fertige FBP-Bild. Bei entrollten Iterationen (Mitte) wechseln sich Datenschritte, die die Messung \(\mathbf p\) einbeziehen, mit kleinen Netzen ab. Alle Stufen werden zusammen trainiert. Plug-and-Play (unten) nimmt einen getrennt trainierten Entrauscher und setzt ihn in eine klassische Iteration anstelle des Regularisierers. In den beiden unteren Varianten muss das Ergebnis immer wieder zur Messung passen.</figcaption>
