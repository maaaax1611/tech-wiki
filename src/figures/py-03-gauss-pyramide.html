<!-- title: Gaußsche Pyramide
     lib: bv, py -->
<figure class="fig">
  <canvas id="cv-gp" class="c-bv-wide" role="img" aria-label="Die Ebenen der Gaußschen Pyramide des Testbilds, jede halb so groß wie die vorige."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="gp-k">Ebenen</label><output id="gp-k-o"></output></div><input id="gp-k" type="range" min="1" max="5" step="1" value="5" autocomplete="off"></div>
    <label class="chk"><input id="gp-u" type="checkbox" autocomplete="off"> auf gleiche Größe ziehen</label>
  </div>
  <div class="readout" id="gp-read"></div>
  <figcaption><b>Abb.</b> Die Gaußsche Pyramide des Testbilds. Jede Ebene entsteht aus der vorigen durch REDUCE: mit \([1, 4, 6, 4, 1]/16\) in beiden Richtungen glätten und jedes zweite Pixel behalten. Zieht man die Ebenen auf gleiche Größe, sieht man, dass jede Ebene eine stärker geglättete Version des Originals ist, wie im Skalenraum, nur mit jeweils halbierter Auflösung. Zusammen brauchen alle Ebenen nur etwa ein Drittel mehr Speicher als das Original.</figcaption>
</figure>
<script>
/* ---------- Gaußsche Pyramide ---------- */
(() => {
  const c = $('#cv-gp'), ik = $('#gp-k'), iu = $('#gp-u'), n = BV_N, G = gaussPyr(BV_PH, n, 5);
  const m = reg({ el: c, draw() {
    const K = +ik.value, up = iu.checked; $('#gp-k-o').textContent = K;
    const { ctx, w, h } = fit(c), gap = 14, top = 22;
    if (up) { const L = imgLayout(w, h, K); G.slice(0, K).forEach((p, k) => drawImg(ctx, p.I, p.n, L[k].x, L[k].y, L[k].size, { title: `G${k}: ${p.n} × ${p.n}` })); }
    else { const s0 = Math.min(h - top - 4, (w - gap * 4) / (1 + 1 / 2 + 1 / 4 + 1 / 8 + 1 / 16)); let x = 0;
      G.slice(0, K).forEach((p, k) => { const sz = s0 / 2 ** k; drawImg(ctx, p.I, p.n, x, top + (s0 - sz), sz, { title: k < 3 ? `G${k}: ${p.n} × ${p.n}` : `G${k}` }); x += sz + gap; }); }
    const tot = G.slice(0, K).reduce((a, p) => a + p.n * p.n, 0);
    $('#gp-read').innerHTML = `<span class="k">Pixel in ${K} Ebene${K > 1 ? 'n' : ''}:</span> ${tot.toLocaleString('de-DE')}  <span class="k">·</span>  <span class="k">Verhältnis zum Original:</span> <b>${nf(tot / (n * n), 3)}</b> (Grenzwert 4/3 = 1,333)  <span class="k">·</span>  <span class="k">Glättung von G${K - 1} gegenüber G0:</span> σ ≈ ${nf(Math.sqrt((4 ** (K - 1) - 1) / 3), 2)} px`;
  } });
  [ik, iu].forEach(e => e.addEventListener('input', () => m.draw()));
})();
</script>
