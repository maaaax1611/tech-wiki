<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourier-Transformation: Breite und Bandbreite</title>
<!-- Erzeugt von build.py aus src/figures/fr-02-transformation.html. Nicht von Hand bearbeiten. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'canvas', 'svg'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>

<link rel="stylesheet" href="../assets/fr.css">
<script>try{var p=new URLSearchParams(location.search),t=p.get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(p.get("frame")==="0")document.documentElement.classList.add("noframe");}catch(e){}</script>

<body>
<main class="widget">
<figure class="fig">
  <canvas id="cv-ft" class="c-fr" role="img" aria-label="Links ein Impuls im Ortsraum, rechts der Betrag und der Realteil seiner Fourier-Transformierten."></canvas>
  <div class="ctrls">
    <div class="ctrl" style="flex:0 1 170px"><div class="lab"><label for="ft-s">Signal</label></div><select id="ft-s" autocomplete="off" style="width:100%"><option value="r">Rechteck</option><option value="g">Gauß</option><option value="d">Dreieck</option></select></div>
    <div class="ctrl"><div class="lab"><label for="ft-w">Breite a</label><output id="ft-w-o"></output></div><input id="ft-w" type="range" min="0.2" max="3" step="0.02" value="1" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="ft-x">Verschiebung x₀</label><output id="ft-x-o"></output></div><input id="ft-x" type="range" min="-2" max="2" step="0.02" value="0" autocomplete="off"></div>
  </div>
  <div class="readout" id="ft-read"></div>
  <figcaption><b>Abb. 2</b> Links das Signal, rechts seine Fourier-Transformierte: der Betrag \(|F(u)|\) (blau) und der Realteil (gelb). Je schmaler das Signal, desto breiter das Spektrum und umgekehrt, das Produkt der Breiten bleibt gleich. Das Rechteck hat wegen seiner harten Kanten ein langsam abklingendes sinc-Spektrum mit Nebenkeulen, der Gauß wieder einen Gauß ohne Nebenkeulen. Eine Verschiebung ändert den Betrag nicht, nur die Phase: Der Realteil beginnt zu schwingen, umso schneller, je weiter das Signal verschoben ist.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/fr.js"></script>
<script>
/* ---------- Fourier-Transformation ---------- */
(() => {
  const c = $('#cv-ft'), is = $('#ft-s'), iw = $('#ft-w'), ix = $('#ft-x');
  const S = {
    r: { f: (x, a) => Math.abs(x) <= a / 2 ? 1 : 0, F: (u, a) => a * sinc(a * u), bw: a => 1 / a, nm: 'a·sinc(a·u)' },
    g: { f: (x, a) => Math.exp(-Math.PI * (x / a) ** 2), F: (u, a) => a * Math.exp(-Math.PI * (a * u) ** 2), bw: a => 1 / a, nm: 'a·exp(−π a²u²)' },
    d: { f: (x, a) => Math.max(0, 1 - Math.abs(x) / a), F: (u, a) => a * sinc(a * u) ** 2, bw: a => 1 / a, nm: 'a·sinc²(a·u)' },
  };
  const m = reg({ el: c, draw() {
    const sg = S[is.value], a = +iw.value, x0 = +ix.value; $('#ft-w-o').textContent = nf(a, 2); $('#ft-x-o').textContent = nf(x0, 2);
    const { ctx, w, h } = fit(c), narrow = w < 560, A = tok('--accent'), B = tok('--bin2');
    const r1 = narrow ? [0, 0, w, h * 0.45] : [0, 0, w * 0.45, h], r2 = narrow ? [0, h * 0.48, w, h * 0.52] : [w * 0.45 + 16, 0, w * 0.55 - 16, h];
    const f = frame(ctx, ...r1, { x0: -4, x1: 4, y0: -0.15, y1: 1.2, xt: [-4, -2, 0, 2, 4], yt: [0, 1], xl: 'x', l: 22, t: 20 });
    ctx.fillStyle = rgba(A, 0.18); ctx.beginPath(); ctx.moveTo(f.X(-4), f.Y(0)); for (let i = 0; i <= 600; i++) { const x = -4 + 8 * i / 600; ctx.lineTo(f.X(x), f.Y(sg.f(x - x0, a))); } ctx.lineTo(f.X(4), f.Y(0)); ctx.fill();
    ctx.strokeStyle = tok('--fg'); ctx.lineWidth = 2.2; curve(ctx, x => sg.f(x - x0, a), f.X, f.Y, -4, 4, 600);
    title(ctx, 'Signal f(x)', r1[0], r1[1] + 13);
    const U = 4, ymax = 3.1, g = frame(ctx, ...r2, { x0: -U, x1: U, y0: -ymax * 0.55, y1: ymax, xt: [-4, -2, 0, 2, 4], yt: [0, 1, 2, 3], xl: 'Frequenz u', l: 22, t: 20 });
    ctx.save(); ctx.beginPath(); ctx.rect(g.bx, g.by, g.bw, g.bh); ctx.clip();
    ctx.strokeStyle = B; ctx.lineWidth = 1.6; curve(ctx, u => sg.F(u, a) * Math.cos(2 * Math.PI * u * x0), g.X, g.Y, -U, U, 800);
    ctx.strokeStyle = A; ctx.lineWidth = 2.4; curve(ctx, u => Math.abs(sg.F(u, a)), g.X, g.Y, -U, U, 800);
    ctx.restore(); title(ctx, 'Spektrum F(u)', r2[0], r2[1] + 13);
    legend(ctx, r2[0] + r2[2], r2[1] + 13, [['|F(u)|', A], ['Re F(u)', B]], { right: true });
    $('#ft-read').innerHTML = `<span class="k">F(u) =</span> ${sg.nm}${x0 ? ' · e<sup>−2πi u x₀</sup>' : ''}  <span class="k">·</span>  <span class="k">Breite im Ort</span> ≈ ${nf(a, 2)}, <span class="k">im Spektrum</span> ≈ ${nf(sg.bw(a), 2)}, <span class="k">Produkt</span> <b>${nf(a * sg.bw(a), 2)}</b>`;
  } });
  [is, iw, ix].forEach(e => e.addEventListener('input', rafDebounce(() => m.draw())));
})();
</script>
</body>
</html>
