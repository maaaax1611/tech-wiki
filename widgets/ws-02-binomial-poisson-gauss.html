<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binomial, Poisson und Gauß</title>
<!-- Erzeugt von build.py aus src/figures/ws-02-binomial-poisson-gauss.html. Nicht von Hand bearbeiten. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'canvas', 'svg'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<link rel="stylesheet" href="../assets/page.css">
<link rel="stylesheet" href="../assets/ws.css">
<script>try{var p=new URLSearchParams(location.search),t=p.get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(p.get("frame")==="0")document.documentElement.classList.add("noframe");}catch(e){}</script>
</head>
<body>
<main class="widget">
<figure class="fig">
  <canvas id="cv-bp" class="c-ws" role="img" aria-label="Binomialverteilung als Balken, die passende Poisson-Verteilung als Punkte und die Gauß-Näherung als Kurve."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="bp-n">Versuche n</label><output id="bp-n-o"></output></div><input id="bp-n" type="range" min="1" max="200" step="1" value="200" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="bp-p">Erfolgswahrscheinlichkeit p</label><output id="bp-p-o"></output></div><input id="bp-p" type="range" min="0.01" max="0.9" step="0.01" value="0.02" autocomplete="off"></div>
  </div>
  <div class="ctrls">
    <span style="font-family:var(--font-display);font-size:14px;color:var(--muted)">Beispiele:</span>
    <button class="btn" type="button" data-np="200,0.02">seltene Ereignisse (p klein)</button>
    <button class="btn" type="button" data-np="100,0.45">viele Versuche (n groß)</button>
    <button class="btn" type="button" data-np="8,0.5">wenige Versuche</button>
  </div>
  <div class="readout" id="bp-read"></div>
  <figcaption><b>Abb. 2</b> Balken: die exakte Binomialverteilung, die Zahl der Erfolge bei \(n\) Versuchen. Punkte und Linie sind zwei Näherungen dafür. Die Poisson-Verteilung (Punkte) hat denselben Mittelwert, aber immer Varianz = Mittelwert, also \(np\) statt \(np(1-p)\). Sie passt deshalb nur, wenn \(p\) klein ist, und ist sonst zu breit. Die Gauß-Näherung (Linie) übernimmt Mittelwert und Varianz exakt, ist aber symmetrisch. Sie passt, wenn die Verteilung breit genug ist, grob ab \(np(1-p) \approx 10\). Bei wenigen Erfolgen ist die Verteilung schief, und Gauß gibt sogar negativen Zählwerten Wahrscheinlichkeit.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/ws.js"></script>
<script>
/* ---------- Binomial, Poisson, Gauß ---------- */
(() => {
  const c = $('#cv-bp'), inn = $('#bp-n'), ip = $('#bp-p');
  const m = reg({ el: c, draw() {
    const n = +inn.value, p = +ip.value, lam = n * p, v = n * p * (1 - p), sd = Math.sqrt(v);
    $('#bp-n-o').textContent = n; $('#bp-p-o').textContent = nf(p, 2);
    const k0 = Math.max(0, Math.floor(lam - 5 * Math.sqrt(lam) - 2)), k1 = Math.min(n, Math.ceil(lam + 5 * Math.sqrt(lam) + 3)), lo = Math.max(-2, k0 - 1);
    const B = [], P = []; let ymax = 0; for (let k = k0; k <= k1; k++) { B.push(binomPmf(k, n, p)); P.push(poisPmf(k, lam)); ymax = Math.max(ymax, B.at(-1), P.at(-1)); }
    const { ctx, w, h } = fit(c);
    const step = Math.max(1, Math.round((k1 - lo) / 8)), xt = []; for (let k = Math.ceil(lo / step) * step; k <= k1; k += step) xt.push(k);
    const narrow = w < 560, f = frame(ctx, 0, narrow ? 16 : 0, w, h - (narrow ? 16 : 0), { x0: lo - 0.5, x1: k1 + 0.5, y0: 0, y1: ymax * 1.15, xt, yt: [0, Math.round(ymax * 100) / 100], yf: v => nf(v, 2), xl: 'k (Zahl der Erfolge)', l: 46, t: 24 });
    const bw = Math.max(1, (f.X(1) - f.X(0)) * 0.8);
    ctx.fillStyle = rgba(tok('--accent'), 0.35); ctx.strokeStyle = tok('--accent');
    B.forEach((b, i) => { const x = f.X(k0 + i); ctx.fillRect(x - bw / 2, f.Y(b), bw, f.Y(0) - f.Y(b)); });
    ctx.fillStyle = tok('--bin2'); P.forEach((q, i) => { ctx.beginPath(); ctx.arc(f.X(k0 + i), f.Y(q), Math.min(4.5, bw / 2 + 1.5), 0, 2 * Math.PI); ctx.fill(); });
    ctx.strokeStyle = tok('--hole'); ctx.lineWidth = 2; curve(ctx, x => normPdf(x, lam, sd), f.X, f.Y, lo - 0.5, k1 + 0.5, 300);
    legend(ctx, f.bx + 4, narrow ? 12 : f.by + 4, [['Binomial(n, p)', tok('--accent')], ['Poisson(λ = np)', tok('--bin2')], ['Gauß(np, np(1−p))', tok('--hole')]], { maxW: w - f.bx - 8 });
    // Abstände (totale Variation)
    let tvP = 0, tvG = 0; for (let k = 0; k <= n; k++) { const b = binomPmf(k, n, p); tvP += Math.abs(b - poisPmf(k, lam)); tvG += Math.abs(b - (normCdf(k + 0.5, lam, sd) - normCdf(k - 0.5, lam, sd))); }
    const verdict = t => t < 0.02 ? '<b>passt gut</b>' : t < 0.07 ? '<b>passt mäßig</b>' : '<b>passt schlecht</b>';
    $('#bp-read').innerHTML = `<span class="k">Varianz exakt (Binomial):</span> np(1−p) = <b>${nf(v, 1)}</b>  <span class="k">·</span>  <span class="k">Poisson nimmt:</span> λ = np = ${nf(lam, 1)}  <span class="k">·</span>  <span class="k">Gauß nimmt:</span> ${nf(v, 1)}<br><span class="k">Poisson-Näherung</span> ${verdict(tvP / 2)}${p > 0.1 ? ' (p nicht klein, Poisson zu breit)' : ''}  <span class="k">·</span>  <span class="k">Gauß-Näherung</span> ${verdict(tvG / 2)}${v < 10 ? ' (zu wenige Erfolge, Verteilung schief)' : ''}`;
  } });
  [inn, ip].forEach(e => e.addEventListener('input', rafDebounce(() => m.draw())));
  c.closest('figure').querySelectorAll('[data-np]').forEach(b => b.addEventListener('click', () => { const [n, p] = b.dataset.np.split(','); inn.value = n; ip.value = p; m.draw(); }));
})();
</script>
</body>
</html>
