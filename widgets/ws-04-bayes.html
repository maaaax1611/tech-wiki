<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satz von Bayes: Test auf eine seltene Krankheit</title>
<!-- Erzeugt von build.py aus src/figures/ws-04-bayes.html. Nicht von Hand bearbeiten. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'canvas', 'svg'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<link rel="stylesheet" href="../assets/page.css">
<link rel="stylesheet" href="../assets/ws.css">
<script>try{var p=new URLSearchParams(location.search),t=p.get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(p.get("frame")==="0")document.documentElement.classList.add("noframe");}catch(e){}</script>
</head>
<body>
<main class="widget">
<figure class="fig">
  <canvas id="cv-by" class="c-ws-by" role="img" aria-label="1000 Personen als Kästchen, eingefärbt nach krank oder gesund und Testergebnis, daneben der Anteil der wirklich Kranken unter den positiv Getesteten."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="by-p">Häufigkeit der Krankheit (Prior)</label><output id="by-p-o"></output></div><input id="by-p" type="range" min="0" max="9" step="1" value="3" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="by-se">Sensitivität P(+ | krank)</label><output id="by-se-o"></output></div><input id="by-se" type="range" min="0.5" max="1" step="0.01" value="0.9" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="by-sp">Spezifität P(− | gesund)</label><output id="by-sp-o"></output></div><input id="by-sp" type="range" min="0.5" max="0.999" step="0.001" value="0.95" autocomplete="off"></div>
  </div>
  <div class="readout" id="by-read"></div>
  <figcaption><b>Abb. 4</b> 1000 Personen als Kästchen, links die Kranken, rechts die Gesunden. Gefüllt sind alle, die der Test als positiv meldet: blau die Kranken, die er richtig erkennt, rot die Gesunden, bei denen er sich irrt. Rechts dieselben Zahlen als Baum und nur die Positiven: Wer ein positives Ergebnis bekommt, ist einer der gefüllten Kästchen, und der blaue Anteil davon ist \(P(\text{krank} \mid +)\). Ist die Krankheit selten, stellen die Gesunden trotz guter Spezifität die meisten positiven Befunde, einfach weil es so viele von ihnen gibt. Der Posterior \(P(\text{krank} \mid +)\) ist dann klein, obwohl \(P(+ \mid \text{krank})\) groß ist.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/ws.js"></script>
<script>
/* ---------- Bayes ---------- */
(() => {
  const c = $('#cv-by'), ip = $('#by-p'), ise = $('#by-se'), isp = $('#by-sp');
  const PREV = [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5], prev = i => PREV[i];
  const pct = v => nf(100 * v, v < 0.01 || v > 0.999 ? 2 : v < 0.1 || v > 0.99 ? 1 : 0) + ' %';
  const m = reg({ el: c, draw() {
    const p = prev(+ip.value), se = +ise.value, sp = +isp.value;
    $('#by-p-o').textContent = pct(p); $('#by-se-o').textContent = pct(se); $('#by-sp-o').textContent = pct(sp);
    const N = 1000, nk = Math.round(N * p), tp = Math.round(nk * se), fn = nk - tp, ng = N - nk, fp = Math.round(ng * (1 - sp)), tn = ng - fp;
    const post = p * se / (p * se + (1 - p) * (1 - sp));
    const { ctx, w, h } = fit(c), narrow = w < 560, A = tok('--accent'), H = tok('--hole'), Mu = tok('--muted'), Fg = tok('--fg');
    // Raster: Kranke und Gesunde als getrennte Blöcke, je spaltenweise, Positive zuerst
    const rows = 25, ck = Math.ceil(nk / rows), cg = Math.ceil(ng / rows), cols = ck + cg + (nk ? 1 : 0);
    const gw = narrow ? w : w * 0.56, top = 40, cell = Math.min(gw / cols, (narrow ? h * 0.4 : h - top - 6) / rows), sz = Math.max(2, cell - 1.6);
    const box = (x, y, t) => { if (t === 'tp') { ctx.fillStyle = A; ctx.fillRect(x, y, sz, sz); } else if (t === 'fp') { ctx.fillStyle = H; ctx.fillRect(x, y, sz, sz); } else { ctx.strokeStyle = t === 'fn' ? A : rgba(Mu, 0.5); ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, sz - 1, sz - 1); } };
    for (let i = 0; i < nk; i++) box(Math.floor(i / rows) * cell, top + (i % rows) * cell, i < tp ? 'tp' : 'fn');
    const xg = nk ? (ck + 1) * cell : 0;
    for (let i = 0; i < ng; i++) box(xg + Math.floor(i / rows) * cell, top + (i % rows) * cell, i < fp ? 'fp' : 'tn');
    // Klammern über den Blöcken
    const brace = (x0, x1, txt, col) => { ctx.strokeStyle = col; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x0, top - 6); ctx.lineTo(x0, top - 12); ctx.lineTo(x1, top - 12); ctx.lineTo(x1, top - 6); ctx.stroke();
      ctx.font = `600 13px ${DISP}`; ctx.fillStyle = col; ctx.textAlign = x1 - x0 < 70 ? 'left' : 'center'; ctx.fillText(txt, x1 - x0 < 70 ? x0 : (x0 + x1) / 2, top - 17); };
    if (nk) brace(0, ck * cell - 1.6, `${nk} krank`, A);
    brace(xg, xg + cg * cell - 1.6, `${ng} gesund`, Fg);
    // Baum der natürlichen Häufigkeiten
    const bx = narrow ? 0 : gw + 24, by0 = narrow ? top + rows * cell + 24 : top, bw = narrow ? w : w - bx;
    ctx.textAlign = 'left'; ctx.font = `13px ${DISP}`;
    const row = (y, parts) => { let x = bx; for (const [t, col, bold] of parts) { ctx.font = `${bold ? '600 ' : ''}13px ${DISP}`; ctx.fillStyle = col; ctx.fillText(t, x, y); x += ctx.measureText(t).width; } };
    row(by0 + 4, [[`${nk} krank`, A, true], [` → ${pct(se)} erkannt → `, Mu], [`${tp} positiv`, A, true]]);
    row(by0 + 24, [[`${ng} gesund`, Fg, true], [` → ${pct(1 - sp)} Fehlalarm → `, Mu], [`${fp} positiv`, H, true]]);
    // nur Positive
    const by = by0 + 52, bh = 26, pos = tp + fp, fr = pos ? tp / pos : 0;
    ctx.font = `600 13px ${DISP}`; ctx.fillStyle = Fg; ctx.fillText(`${pos} positiv getestet, davon`, bx, by - 6);
    ctx.fillStyle = A; ctx.fillRect(bx, by, bw * fr, bh); ctx.fillStyle = H; ctx.fillRect(bx + bw * fr, by, bw * (1 - fr), bh);
    ctx.font = `12px ${DISP}`; ctx.fillStyle = Mu; ctx.fillText(`${tp} krank`, bx, by + bh + 15); ctx.textAlign = 'right'; ctx.fillText(`${fp} gesund`, bx + bw, by + bh + 15);
    ctx.textAlign = 'left'; ctx.fillStyle = Fg; ctx.font = `600 ${narrow ? 22 : 28}px ${DISP}`; ctx.fillText(pct(post), bx, by + bh + (narrow ? 42 : 52));
    const tw = ctx.measureText(pct(post)).width; ctx.font = `13px ${DISP}`; ctx.fillStyle = Mu; ctx.fillText(`= ${tp} / ${pos} = P(krank | positiv)`, bx + tw + 10, by + bh + (narrow ? 36 : 44));
    ctx.fillText('So wahrscheinlich ist man bei positivem', bx, by + bh + (narrow ? 64 : 80)); ctx.fillText('Test wirklich krank.', bx, by + bh + (narrow ? 80 : 96));
    $('#by-read').innerHTML = `<span class="k">Bayes:</span> P(krank | +) = P(+ | krank)·P(krank) / P(+) = ${nf(se, 2)}·${nf(p, 3)} / (${nf(se, 2)}·${nf(p, 3)} + ${nf(1 - sp, 3)}·${nf(1 - p, 3)}) = <b>${pct(post)}</b>  <span class="k">·</span>  <span class="k">umgekehrt, P(gesund | −) =</span> ${pct(sp * (1 - p) / (sp * (1 - p) + (1 - se) * p))}`;
  } });
  [ip, ise, isp].forEach(e => e.addEventListener('input', rafDebounce(() => m.draw())));
})();
</script>
</body>
</html>
