<title>SIRT und Semikonvergenz</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'canvas', 'svg'] }
};

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>

<script>try{var p=new URLSearchParams(location.search),t=p.get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(p.get("frame")==="0")document.documentElement.classList.add("noframe");}catch(e){}</script>

<body>
<main class="widget">
<figure class="fig">
  <canvas id="cv-sc" class="c-ir-3" role="img" aria-label="SIRT-Rekonstruktion nach einer wählbaren Zahl von Iterationen und der Fehler zum Phantom über die Iterationen, mit und ohne Rauschen."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="sc-k">Iteration</label><output id="sc-k-o"></output></div><input id="sc-k" type="range" min="1" max="300" step="1" value="15" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="sc-d">Photonen pro Strahl</label><output id="sc-d-o"></output></div><input id="sc-d" type="range" min="2" max="4.5" step="0.05" value="2.3" autocomplete="off"></div>
    <button class="btn" type="button" id="sc-p">Abspielen</button>
  </div>
  <div class="readout" id="sc-read"></div>
  <figcaption><b>Abb. 2</b> SIRT auf verrauschten Daten (60 Winkel). Links das Bild nach der gewählten Zahl von Iterationen, in der Mitte dasselbe ohne Rauschen in den Daten, rechts der Fehler zum Phantom für beide. Ohne Rauschen sinkt der Fehler immer weiter. Mit Rauschen sinkt er zunächst ebenso, weil erst die groben Strukturen entstehen. Später kommen die feinen Komponenten mit kleinen Singulärwerten dazu, und mit ihnen das verstärkte Rauschen: Der Fehler steigt wieder, das Bild wird körnig. Je weniger Photonen, desto früher ist das Optimum erreicht.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/ir.js"></script>
<script>
/* ---------- Semikonvergenz ---------- */
(() => {
  const c = $('#cv-sc'), ik = $('#sc-k'), idd = $('#sc-d'), bp = $('#sc-p'), n = 64, K = 300; let A = null, X = null, clean = null, key = '', R = null, timer = null;
  const run = p => { const snaps = [], err = []; solve(A, p, { iter: K, pos: true, each: (k, x) => { snaps.push(Float32Array.from(x)); err.push(rmse(x, X)); } }); return { snaps, err }; };
  const compute = () => { if (!A) { A = buildA(n, 60, 92); X = phantom(n); clean = run(measure(A, X, 0).p); }
    setSeed(77); R = run(measure(A, X, Math.round(10 ** +idd.value), 3).p); };
  const m = reg({ el: c, playing: false, anim: true, step(dt) { let k = +ik.value + dt * 40; if (k >= K) { k = K; this.playing = false; bp.textContent = 'Abspielen'; } ik.value = Math.round(k); }, draw() {
    const k = +ik.value; $('#sc-k-o').textContent = k; $('#sc-d-o').textContent = Math.round(10 ** +idd.value).toLocaleString('de-DE');
    if (key !== idd.value) { key = idd.value; clearTimeout(timer); timer = setTimeout(() => { compute(); m.draw(); }, R ? 80 : 30); }
    const { ctx, w, h } = fit(c), narrow = w < 560;
    if (!R) { title(ctx, 'Rekonstruktionen werden berechnet …', 0, 16); return; }
    const s = narrow ? Math.min(w / 2 - 8, h * 0.45) : Math.min(h - 26, w * 0.3), top = 22;
    drawImg(ctx, R.snaps[k - 1], n, 0, top, s, { lo: 0, hi: 0.5, title: 'mit Rauschen' });
    drawImg(ctx, clean.snaps[k - 1], n, s + 14, top, s, { lo: 0, hi: 0.5, title: 'ohne Rauschen' });
    const px = narrow ? 0 : 2 * s + 32, py = narrow ? top + s + 10 : 0, pw = narrow ? w : w - px, ph = narrow ? h - py : h;
    const emax = Math.max(...R.err, ...clean.err) * 1.05, f = frame(ctx, px, py, pw, ph, { x0: 1, x1: K, y0: 0, y1: emax, xt: [1, 100, 200, 300], yt: [0, 0.05, 0.1], yf: v => nf(v, 2), xl: 'Iteration', l: 40, t: 40 });
    [[clean.err, tok('--muted')], [R.err, tok('--hole')]].forEach(([e, col]) => { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); e.forEach((v, i) => i ? ctx.lineTo(f.X(i + 1), f.Y(v)) : ctx.moveTo(f.X(1), f.Y(v))); ctx.stroke(); });
    const best = R.err.indexOf(Math.min(...R.err)) + 1;
    ctx.strokeStyle = tok('--accent'); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(f.X(k), f.by); ctx.lineTo(f.X(k), f.by + f.bh); ctx.stroke();
    ctx.fillStyle = tok('--hole'); ctx.beginPath(); ctx.arc(f.X(best), f.Y(R.err[best - 1]), 4, 0, 2 * Math.PI); ctx.fill();
    title(ctx, 'Fehler zum Phantom', px, py + 14); legend(ctx, px + pw, py + 32, [['mit Rauschen', tok('--hole')], ['ohne', tok('--muted')]], { right: true });
    $('#sc-read').innerHTML = `<span class="k">Iteration ${k}:</span> Fehler ${nf(R.err[k - 1], 4)} mit, ${nf(clean.err[k - 1], 4)} ohne Rauschen  <span class="k">·</span>  <span class="k">bester Abbruch bei Iteration</span> <b>${best}</b>`;
  } });
  [ik, idd].forEach(e => e.addEventListener('input', () => m.draw()));
  bp.addEventListener('click', () => { m.playing = !m.playing; if (m.playing && +ik.value >= K) ik.value = 1; bp.textContent = m.playing ? 'Anhalten' : 'Abspielen'; });
})();
</script>
</body>
</html>
